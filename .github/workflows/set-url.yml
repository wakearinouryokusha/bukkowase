name: Set target URL
 
on:
  workflow_dispatch:
    inputs:
      url:
        description: '30分ごとにアクセスするURL(https://...)'
        required: true
        type: string
 
permissions:
  contents: write
  actions: write
 
concurrency:
  group: set-target-url
  cancel-in-progress: false
 
jobs:
  set-url:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
 
      - name: Save URL
        env:
          INPUT_URL: ${{ github.event.inputs.url }}
        run: |
          url=$(printf '%s' "$INPUT_URL" | tr -d '[:space:]')
          if ! printf '%s' "$url" | grep -qE '^https?://[^[:space:]]+$'; then
            echo "::error::http:// または https:// で始まるURLを入力してください"
            exit 1
          fi
          mkdir -p config
          printf '%s\n' "$url" > config/url.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/url.txt
          if git diff --cached --quiet; then
            echo "URLは変更なし"
          else
            git commit -m "Set target URL"
            git push
          fi
 
      - name: Run a visit now
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run visit.yml
